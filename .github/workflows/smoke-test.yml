name: Gemma 4 31B smoke test

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt to send to gemma-4-31b-it"
        default: "Say hello in one sentence."
        required: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Call gemma-4-31b-it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gemma.py "${{ inputs.prompt || 'Say hello in one sentence.' }}"
