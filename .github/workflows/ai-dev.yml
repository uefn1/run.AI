name: AI Game Dev Loop

on:
  workflow_dispatch:
    inputs:
      iteration:
        description: "イテレーション番号(1=新規開発、2以降=バグ修正・機能追加)"
        default: "1"
        type: string
      max_iterations:
        description: "最大イテレーション数(この回数でループ停止)"
        default: "10"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-game-dev-loop
  cancel-in-progress: false

jobs:
  run-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Call API and write files into files/
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ITERATION: ${{ inputs.iteration }}
        run: python dev.py

      - name: Verify game behavior in browser
        env:
          ITERATION: ${{ inputs.iteration }}
        run: |
          set +e
          python tests/test_game.py > tests/last_result.txt 2>&1
          TEST_EXIT=$?
          set -e
          tail -c 4000 tests/last_result.txt > /tmp/last_result_tail.txt && mv /tmp/last_result_tail.txt tests/last_result.txt
          echo "TEST_EXIT=$TEST_EXIT" >> "$GITHUB_ENV"
          echo "test exit code: $TEST_EXIT"
          tail -30 tests/last_result.txt || true

      - name: Commit and push
        env:
          ITERATION: ${{ inputs.iteration }}
        run: |
          git config user.name "ai-dev-bot"
          git config user.email "ai-dev-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更がなかったためコミットをスキップします"
          else
            git commit -m "ai-dev: iteration ${ITERATION}"
            git push
          fi

      - name: Launch next process, then finish this one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITERATION: ${{ inputs.iteration }}
          MAX_ITERATIONS: ${{ inputs.max_iterations }}
        run: |
          NEXT=$((ITERATION + 1))
          if [ "$NEXT" -le "$MAX_ITERATIONS" ]; then
            gh workflow run ai-dev.yml --ref main -f iteration="$NEXT" -f max_iterations="$MAX_ITERATIONS"
            echo "次のプロセス(イテレーション ${NEXT})を起動しました。現在のプロセスを終了します。"
          else
            echo "最大イテレーション数 ${MAX_ITERATIONS} に到達したため、ループを終了します。"
          fi

      - name: Fail if the game did not behave as specified
        if: env.TEST_EXIT != '0'
        run: |
          echo "ブラウザテストが失敗しました(結果は tests/last_result.txt、次のイテレーションで修正されます)。"
          exit 1
